name: Wire tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        name: Validate TrueNAS Community App package
        shell: bash
        run: |
          python -m pip install pyyaml
          validation_root=$(mktemp -d)
          git clone --depth 1 --filter=blob:none --sparse https://github.com/truenas/apps.git "$validation_root"
          git -C "$validation_root" sparse-checkout set .github library
          mkdir -p "$validation_root/ix-dev/community/wire"
          cp -R truenas-app/. "$validation_root/ix-dev/community/wire/"
          cd "$validation_root"
          python .github/scripts/ci.py --app wire --train community \
            --test-file basic-values.yaml --render-only true --skip-metadata
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          TURN_TEST_IP=$(hostname -I | awk '{print $1}')
          trap 'docker inspect -f "status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}" wire-turn-test 2>/dev/null || true; docker logs wire-turn-test 2>/dev/null || true; docker rm -f wire-turn-test 2>/dev/null || true' EXIT
          docker run -d --name wire-turn-test --network host \
            coturn/coturn:4.17.2-r0 \
            --fingerprint --use-auth-secret \
            --static-auth-secret=wire-ci-turn-secret-at-least-32-bytes \
            --realm=wire.test --min-port=49160 --max-port=49200 \
            --listening-ip="$TURN_TEST_IP" --relay-ip="$TURN_TEST_IP" \
            --no-tls --no-dtls --log-file=stdout
          sleep 2
          docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' wire-turn-test
          TURN_TEST_IP="$TURN_TEST_IP" python - <<'PY'
          import os, socket, struct, time
          tx = os.urandom(12)
          request = struct.pack("!HHI12s", 1, 0, 0x2112A442, tx)
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.settimeout(1)
          for attempt in range(10):
              try:
                  sock.sendto(request, (os.environ["TURN_TEST_IP"], 3478))
                  response, _ = sock.recvfrom(2048)
                  assert response[:2] == b"\x01\x01" and response[8:20] == tx
                  break
              except TimeoutError:
                  if attempt == 9:
                      raise
                  time.sleep(1)
          PY
          docker logs wire-turn-test
