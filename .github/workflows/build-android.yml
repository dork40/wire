name: Build Wire Android APK

on:
  push:
    branches: [main]
    paths:
      - "wire.py"
      - "wire_crypto_android.py"
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "wire.py"
      - "wire_crypto_android.py"
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Android SDK/NDK download and every recipe's cross-compile (Kivy,
      # Pillow, pycryptodome, ...) otherwise redo from scratch on every run -
      # 15+ minutes before the build even reaches our own app code.
      - name: Cache buildozer/python-for-android state
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # The third-party ArtemSBulgakov/buildozer-action wraps this same image
      # with extra setup (installing a Java PPA) that broke against current
      # Ubuntu releases. Running the official image directly skips that
      # unmaintained wrapper entirely.
      - name: Build debug APK with the official Buildozer Docker image
        run: |
          docker run --rm -v "$PWD":/home/user/hostcwd ghcr.io/kivy/buildozer:latest android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wire-android-debug
          path: bin/*.apk
          if-no-files-found: error
