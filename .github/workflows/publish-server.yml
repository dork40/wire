name: Publish Wire server container

on:
  push:
    branches: [main]
    paths:
      - wire-server.py
      - wire-web.py
      - Dockerfile
      - .github/workflows/publish-server.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dork40/wire-server:1.4.27
            ghcr.io/dork40/wire-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/dork40/wire
            org.opencontainers.image.version=1.4.27
