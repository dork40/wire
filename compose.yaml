services:
  wire-server:
    image: ghcr.io/dork40/wire-server:1.4.27
    pull_policy: always
    container_name: wire-server
    restart: unless-stopped
    environment:
      WIRE_STATE: /data
      WIRE_TURN_URLS: ${WIRE_TURN_URLS:-turn:wirecmd.ddns.net:3478?transport=udp,turn:wirecmd.ddns.net:3478?transport=tcp}
      WIRE_TURN_SECRET: ${WIRE_TURN_SECRET:?set WIRE_TURN_SECRET}
      WIRE_BACKUP_DIR: /backups
      WIRE_BACKUP_INTERVAL: 21600
      WIRE_BACKUP_RETAIN: 28
    ports:
      - "47666:47666/tcp"
    volumes:
      - ./wire-server-data:/data
      - ./wire-server-backups:/backups
  wire-web:
    image: ghcr.io/dork40/wire-server:1.4.27
    pull_policy: always
    restart: unless-stopped
    command: ["python", "/app/wire-web.py"]
    environment:
      WIRE_STATE: /data
      WIRE_BACKUP_DIR: /backups
    ports:
      - "8097:8097/tcp"
    volumes:
      - ./wire-server-data:/data:ro
      - ./wire-server-backups:/backups:ro
  wire-turn:
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    network_mode: host
    command:
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${WIRE_TURN_SECRET:?set WIRE_TURN_SECRET}
      - --realm=wirecmd.ddns.net
      - --external-ip=${WIRE_PUBLIC_IP:?set WIRE_PUBLIC_IP}/${WIRE_PRIVATE_IP:-192.168.1.199}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --stale-nonce=600
      - --user-quota=4
      - --total-quota=100
      - --max-bps=25000000
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=224.0.0.0-255.255.255.255
      - --log-file=stdout
x-portals:
  - host: 0.0.0.0
    name: Wire Web UI
    path: /
    port: 8097
    scheme: http
