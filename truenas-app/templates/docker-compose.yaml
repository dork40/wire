{% set tpl = ix_lib.base.render.Render(values) %}
{% set server = tpl.add_container(values.consts.server_container_name, "image") %}
{% set web = tpl.add_container(values.consts.web_container_name, "image") %}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": 0, "gid": 0, "mode": "check"} %}

{% do server.set_user(0, 0) %}
{% do server.environment.add_env("WIRE_STATE", "/data") %}
{% do server.environment.add_env("WIRE_BACKUP_DIR", "/data/backups") %}
{% do server.environment.add_env("WIRE_BACKUP_INTERVAL", "21600") %}
{% do server.environment.add_env("WIRE_BACKUP_RETAIN", "28") %}
{% do server.add_port(values.network.server_port, {"container_port": values.consts.server_internal_port}) %}
{% do server.add_storage("/data", values.storage.data) %}
{% do server.healthcheck.set_test("tcp", {"port": values.consts.server_internal_port}) %}

{% do web.set_user(0, 0) %}
{% do web.set_command(["python", "/app/wire-web.py"]) %}
{% do web.environment.add_env("WIRE_STATE", "/data") %}
{% do web.environment.add_env("WIRE_BACKUP_DIR", "/data/backups") %}
{% do web.add_port(values.network.web_port, {"container_port": values.consts.web_internal_port}) %}
{% do web.add_storage("/data", dict(values.storage.data, **{"read_only": true})) %}
{% do web.healthcheck.set_test("tcp", {"port": values.consts.web_internal_port}) %}

{% do perms.add_or_skip_action("data", values.storage.data, perms_config) %}
{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do server.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do web.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"name": "Wire Web UI", "scheme": "http", "path": "/"}) %}
{% do tpl.notes.add_info("Connect a client with /private <TrueNAS-IP>. Wire uses TCP port %s."|format(values.network.server_port.port_number)) %}
{% do tpl.notes.add_warning("This app is LAN-only by default. Do not expose the TrueNAS management UI. For remote users, prefer Tailscale and give them the NAS Tailscale IP.") %}

{{ tpl.render() | tojson }}
